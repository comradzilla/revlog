version: "3.8"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ceo-dashboard-timescaledb
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ceo_dashboard
      POSTGRES_USER: ceo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard2024}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceo -d ceo_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
    driver: local
