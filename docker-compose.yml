version: "3.8"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ceo-dashboard-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ceo_dashboard
      POSTGRES_USER: ceo
      POSTGRES_PASSWORD: dashboard2024
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceo -d ceo_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
